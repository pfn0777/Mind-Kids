<title>Mind Kids — Aqlli o‘yinlar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f4f6ff;--card:#fff;--ink:#1d2458;--muted:#6b7394;--line:#e4e8f5;--soft:#eef2ff;--cell:#f8faff;--brand:#6259ff;--brand2:#ef63b6;--blue:#4d8dff;--ok:#16a35a;--okbg:#e3f8ec;--bad:#e2445c;--badbg:#fde7eb;--gold:#f5b301;--shadow:0 8px 24px #3b4a9a14}
:root[data-theme=dark]{--bg:#111429;--card:#1b1f3d;--ink:#eef0ff;--muted:#a1a8cf;--line:#2e3464;--soft:#262b52;--cell:#20254a;--okbg:#123b28;--badbg:#45172b;--shadow:0 8px 24px #0006}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;overflow-x:clip;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation;padding:0}
button:disabled{opacity:.45;cursor:default}
.app{max-width:760px;margin:0 auto;padding:10px 16px 32px}
.top{display:flex;align-items:center;gap:10px;padding:4px 0 12px}
.logo{width:46px;height:auto;flex:none;filter:drop-shadow(0 4px 8px #3b4a9a33)}
.brand{flex:1;min-width:0;display:flex;align-items:center}.brand img{height:40px;width:auto;max-width:100%;display:block}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:20px;flex:none}
.hello{background:linear-gradient(135deg,#5b7cff,#8a5cff 60%,#ef63b6);color:#fff;border-radius:24px;padding:18px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.hello h1{margin:0;font-size:21px;line-height:1.2}.hello p{margin:6px 0 0;opacity:.92;font-size:14px}
.hello .big{width:92px;height:auto;margin-left:auto;flex:none;filter:drop-shadow(0 8px 14px #0003);animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
@media(max-width:350px){.hello .big{width:70px}.brand img{height:32px}.top .iconbtn{width:40px;height:40px}.chip{padding:0 4px}}
@media(max-width:400px){.chip .cx{display:none}}
.pill{display:inline-block;margin-top:10px;background:#ffffff2e;padding:6px 10px;border-radius:99px;font-weight:800;font-size:13px}
.chips{display:flex;flex-direction:column;gap:8px;padding:14px 0 12px}
.crow{display:grid;grid-template-columns:repeat(var(--c),minmax(0,1fr));gap:6px}.crow:first-child{grid-template-columns:minmax(0,1.35fr) repeat(3,minmax(0,1fr))}
.chip{min-width:0;padding:0 6px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:13px;min-height:40px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cnt{font-size:13px;color:var(--muted);font-weight:700;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:5px;box-shadow:var(--shadow);transition:transform .12s}
.card:active{transform:scale(.97)}
.card .art{height:78px;border-radius:14px;display:grid;place-items:center;font-size:40px;margin-bottom:3px}
.a1{background:#34c77b26}.a2{background:#ff6fa426}.a3{background:#8a6bff26}.a4{background:#3fa2ff26}.a5{background:#ffc93c33}.a6{background:#7ed95a2e}
.card .n{font-weight:900;font-size:15px;line-height:1.2}.card .d{font-size:12px;color:var(--muted);line-height:1.35}
.card .f{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:4px;font-size:11px;color:var(--muted);font-weight:800}
.stars{color:var(--gold);letter-spacing:1px;font-size:13px}
.cta{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;gap:12px;align-items:center}
.cta b{display:block}.cta small{color:var(--muted)}
.btn{min-height:46px;padding:0 18px;border-radius:14px;background:var(--soft);font-weight:900;font-size:15px;border:1px solid var(--line)}
.btn.pri{background:linear-gradient(135deg,var(--blue),var(--brand));color:#fff;border:0}
.btn.sm{min-height:40px;font-size:14px;padding:0 14px}
.btn.danger{color:var(--bad);background:transparent;width:100%;margin-top:14px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:18px 0 0}
/* screens */
.screen{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;overflow-y:auto;overscroll-behavior:contain}
.screen.show{display:flex}
.sbar{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:8px;padding:8px 16px;z-index:3;border-bottom:1px solid var(--line)}
.sbar .t{font-weight:900;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbody{max-width:640px;width:100%;margin:0 auto;padding:12px 16px 28px;display:flex;flex-direction:column;gap:10px}
.hud{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.hud span.hit{animation:shake .3s;border-color:var(--bad)}.hud span{background:var(--card);border:1px solid var(--line);padding:6px 10px;border-radius:12px;font-weight:800;font-size:13px}
.lvl{height:8px;border-radius:9px;background:var(--line);overflow:hidden}.lvl i{display:block;height:100%;width:10%;background:linear-gradient(90deg,var(--blue),var(--brand2));transition:width .3s}
.timer{height:6px;border-radius:9px;background:var(--line);overflow:hidden;visibility:hidden}.timer.on{visibility:visible}.timer i{display:block;height:100%;width:100%;background:var(--gold)}.timer.low i{background:var(--bad)}
.prompt{text-align:center;font-weight:900;font-size:19px;line-height:1.4;min-height:27px}
.prompt svg{vertical-align:middle}
.board{min-height:140px;border:1px solid var(--line);border-radius:20px;background:var(--card);padding:14px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{min-height:62px;border-radius:16px;background:var(--card);border:2px solid var(--line);font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;flex-direction:column;transition:transform .1s}
.opt:active{transform:scale(.96)}
.opt.emo{font-size:38px}.opt.num{font-size:26px}.opt small{font-size:12px;font-weight:800;color:var(--muted)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{50%{transform:scale(1.15)}}
.fb{text-align:center;font-weight:800;min-height:24px;font-size:15px}.fb.y{color:var(--ok)}.fb.x{color:var(--bad)}.fb.n{color:var(--muted)}
/* shared game parts */
.tgrid{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px;width:min(100%,var(--w,330px))}
.tc{aspect-ratio:1;border-radius:12px;background:var(--cell);border:2px solid var(--line);display:grid;place-items:center;font-size:var(--fs,24px);font-weight:900;line-height:1;min-width:0}
.tc.ok{border-color:var(--ok);background:var(--okbg)}.tc.bad{border-color:var(--bad);background:var(--badbg);animation:shake .3s}
.tc.lit{background:var(--brand);border-color:var(--brand)}.tc.dim{opacity:.3}.tc.sel{border-color:var(--brand);box-shadow:0 0 0 3px #6259ff55}
.tc.given{background:var(--soft)}.tc.ro{pointer-events:none}.tc.hit{animation:pop .25s}
.sc{aspect-ratio:1;display:grid;place-items:center;font-size:28px}
.tgt{display:inline-block;min-width:40px;padding:0 8px;border-radius:10px;background:var(--brand);color:#fff}
.expr{font-size:40px;font-weight:900;letter-spacing:1px}
.sq{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.sq b{min-width:46px;padding:10px 6px;border-radius:12px;background:var(--soft);font-size:19px;text-align:center}.sq b.q{background:var(--brand);color:#fff}
.eq{display:flex;flex-direction:column;gap:8px;font-size:24px;font-weight:900;text-align:center}
.wh{font-size:34px;vertical-align:middle}
.slots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.slot{width:44px;height:50px;border-radius:12px;border:2px dashed var(--line);display:grid;place-items:center;font-size:20px;font-weight:900;background:var(--cell)}
.slot.f{border-style:solid;border-color:var(--brand)}.slot.ok{border-color:var(--ok);background:var(--okbg)}.slot.bad{border-color:var(--bad);background:var(--badbg)}
.tiles{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tile{width:50px;height:54px;border-radius:14px;background:linear-gradient(135deg,#ffd46b,#ffb13b);color:#3a2a00;font-size:20px;font-weight:900;box-shadow:0 3px 0 #d9901d}
.tile.used{visibility:hidden}
.swc{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.pix{display:grid;gap:3px}.pix i{border-radius:3px;background:var(--line);aspect-ratio:1}
.mir{display:flex;align-items:center;gap:12px}.mir.v{flex-direction:column}
.mline{width:4px;align-self:stretch;background:repeating-linear-gradient(var(--blue) 0 6px,transparent 6px 10px);border-radius:3px}
.mir.v .mline{height:4px;width:100%;min-width:90px;background:repeating-linear-gradient(90deg,var(--blue) 0 6px,transparent 6px 10px)}
.pq{width:84px;height:84px;border-radius:14px;border:2px dashed var(--line);display:grid;place-items:center;font-size:34px;font-weight:900;color:var(--muted)}
.rotb{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}.rarrow{font-size:22px;font-weight:900;color:var(--brand)}
.two{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;width:100%}.two>div{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:100%}.two .tgrid{width:var(--w);max-width:calc(100vw - 60px)}
.lab{font-size:12px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.mxg{display:grid;grid-template-columns:repeat(3,76px);gap:6px}.mxg>div{height:76px;border-radius:12px;background:var(--cell);border:2px solid var(--line);display:grid;place-items:center}
.mxg>div.q{border-style:dashed;font-size:30px;font-weight:900;color:var(--muted)}
.mx{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;align-items:center;max-width:70px}
.maze{display:grid;grid-template-columns:repeat(var(--n),1fr);width:min(100%,330px);touch-action:none}
.mzc{aspect-ratio:1;border:0 solid var(--ink);display:grid;place-items:center;font-size:var(--fs);font-style:normal;line-height:1}
.mzc.v{background:#6259ff1f}
.dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,52px);gap:6px}
.dpad button{border-radius:14px;background:var(--soft);border:1px solid var(--line);font-size:22px}
.pads{display:grid;grid-template-columns:repeat(2,120px);gap:12px}
.pad{height:110px;border-radius:26px;background:var(--c);opacity:.45;display:grid;place-items:center;transition:opacity .08s,transform .08s}
.pad.lit{opacity:1;transform:scale(1.05);box-shadow:0 0 24px var(--c);animation:pop .25s}
.pad svg{width:34px;height:34px}
.sdk .br{margin-right:6px}.sdk .bb{margin-bottom:6px}
.pal{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pbtn{width:46px;height:46px;border-radius:14px;border:3px solid transparent;font-size:24px;background:var(--soft)}
.pbtn.on{border-color:var(--ink);transform:scale(1.08)}
.field{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:340px}
.nbbox{width:130px;height:130px;border-radius:26px;background:var(--cell);border:3px solid var(--line);display:grid;place-items:center;font-size:70px;font-weight:900;transition:border-color .15s}
.nbbox.in{animation:pop .25s}.nbbox.good{border-color:var(--ok);background:var(--okbg)}.nbbox.wrong{border-color:var(--bad);background:var(--badbg)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.dots{display:flex;gap:5px;justify-content:center}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.dots i.y{background:var(--ok)}.dots i.x{background:var(--bad)}
.keys{display:grid;grid-template-columns:repeat(4,58px);gap:8px;justify-content:center}.keys button{height:58px;border-radius:14px;background:var(--cell);border:2px solid var(--line);font-size:28px;font-weight:900}
.prog{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:40px}
.ps{width:36px;height:36px;border-radius:10px;border:2px dashed var(--line);display:grid;place-items:center;font-size:18px}
.ps.f{border-style:solid;border-color:var(--brand);background:var(--soft)}.ps.cur{background:var(--brand)}
.pulse{width:84px;height:84px;border-radius:50%;background:var(--soft);border:3px solid var(--line);transition:all .08s}
.pulse.on{background:var(--brand2);border-color:var(--brand2);transform:scale(1.12)}
.bts{display:flex;gap:5px;align-items:center;justify-content:center}.bt{display:block;height:14px;border-radius:7px;background:var(--brand)}.bt.s{width:14px}.bt.l{width:40px}
.mini{display:inline-block;font-size:12px;font-weight:800;color:var(--muted);background:var(--soft);padding:3px 9px;border-radius:99px;margin-bottom:4px}
.end{text-align:center;padding:10px 0}.endstars{font-size:52px;color:var(--gold);letter-spacing:4px}.end h2{margin:6px 0}.end p{margin:6px 0;color:var(--muted)}.end p b{color:var(--ink)}
.rec{color:var(--gold)!important;font-weight:900}.endbtns{display:flex;gap:14px;justify-content:center;margin-top:16px}
.endbtn{display:flex;flex-direction:column;align-items:center;gap:6px;width:84px}
.endbtn span{width:66px;height:66px;border-radius:22px;display:grid;place-items:center;font-size:30px;background:var(--soft);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .12s}
.endbtn.pri span{background:linear-gradient(135deg,var(--blue),var(--brand));border:0;width:76px;height:76px;margin-top:-5px;font-size:34px}
.endbtn:active span{transform:scale(.92)}.endbtn small{font-size:12px;font-weight:800;color:var(--muted);line-height:1.2}
.end .nextname{font-size:13px;margin-top:12px}
/* parent */
.tiles4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.tiles4{grid-template-columns:repeat(4,1fr)}}
.tile4{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}.tile4 b{display:block;font-size:22px}.tile4 small{color:var(--muted);font-weight:700}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px}
.box h3{margin:0 0 10px;font-size:16px}
.sk{margin:10px 0}.sk small{display:flex;justify-content:space-between;font-weight:800;margin-bottom:5px}.sk em{color:var(--muted);font-style:normal;font-weight:600}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}.bar span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--brand2))}
.li{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:14px}.li:first-of-type{border-top:0}.li span:last-child{color:var(--muted);font-weight:700}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}.empty div{font-size:48px}
.tip{background:var(--soft);border-radius:14px;padding:12px;font-size:14px;line-height:1.5;margin-top:12px}
</style>
</head>

const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function numOpts(ans,cands,n=4,min=0){const lo=[],hi=[],seen=new Set([ans]);for(const c of shuffle(cands)){if(!Number.isInteger(c)||c<min||seen.has(c))continue;seen.add(c);(c<ans?lo:hi).push(c)}const r=ri(0,Math.min(n-1,ans-min)),used=new Set([ans]),below=[],above=[];for(const c of lo){if(below.length>=r)break;below.push(c);used.add(c)}for(let k=1;below.length<r;k++){const c=ans-k;if(c>=min&&!used.has(c)){below.push(c);used.add(c)}}for(const c of hi){if(above.length>=n-1-r)break;above.push(c);used.add(c)}for(let k=1;above.length<n-1-r;k++){const c=ans+k;if(!used.has(c)){above.push(c);used.add(c)}}return[ans,...below,...above]}

function startTimer(sec,onEnd,tok){const el=$('#timer'),bar=el.firstElementChild;el.classList.add('on');el.classList.remove('low');bar.style.width='100%';const t0=Date.now(),total=sec*1000;let stopped=false;const id=setInterval(()=>{if(stopped)return;const left=Math.max(0,total-(Date.now()-t0));bar.style.width=(left/total*100)+'%';el.classList.toggle('low',left<total*.25);if(left<=0){stop();if(tok===S.tok&&!S.answered)onEnd()}},100);S.ints.push(id);let tEnd=0;function stop(){if(!stopped){stopped=true;tEnd=Date.now();clearInterval(id)}}const api={stop,left:()=>Math.max(0,(total-((tEnd||Date.now())-t0))/1000)};S.timer=api;return api}

function cleanup(){S.timers.forEach(clearTimeout);S.ints.forEach(clearInterval);S.offs.forEach(f=>f());S.timers=[];S.ints=[];S.offs=[];S.timer=null;
  const b=$('#board');b.onclick=null;b.onpointerdown=null;b.innerHTML='';b.style.display='';
  const o=$('#opts');o.onclick=null;o.innerHTML='';o.style.gridTemplateColumns='';
  $('#timer').classList.remove('on');const f=$('#fb');f.textContent='';f.className='fb';

function makeApi(tok){const live=()=>tok===S.tok&&!S.answered;return{L:S.level,age:S.age,board:$('#board'),live,lang:curLang,
  prompt:(h,say)=>setPrompt(h,say),hint,done:(ok,o)=>finishRound(tok,ok,o),fresh,
  later:(fn,ms)=>{S.timers.push(setTimeout(()=>{if(live())fn()},ms))},
  every:(fn,ms)=>{S.ints.push(setInterval(()=>{if(live())fn()},ms))},
  on:(el,ev,fn,opt)=>{el.addEventListener(ev,fn,opt);S.offs.push(()=>el.removeEventListener(ev,fn,opt))},
  miss:()=>{if(live())loseLife();return S.lives<=0},
  timer:(sec,onEnd)=>startTimer(sec,onEnd,tok)}}

function finishRound(tok,ok,o={}){if(tok!==S.tok||S.answered)return;
  if(S.timer)S.timer.stop();
  S.answered=true;const p=per(S.g.id);
  if(ok){S.streak++;S.ok++;p.c++;ST.c++;const gain=100+(S.streak>=3?50:0)+Math.round(o.bonus||0);S.score+=gain;Snd.ok();hap('ok');fb(true,(o.msg?o.msg+' ':'')+pick(PRAISE[LANG])+' +'+gain)}
  else{S.streak=0;if(!S.rl){S.lives--;Snd.bad();hap('bad')}S.bad++;p.w++;ST.w++;fb(false,o.msg||tr('wrong_default'))}
  saveStats();hud();

function nextRound(){if(S.lives<=0||S.level>=10)return endGame();S.level++;startRound()}
function startRound(){cleanup();S.tok++;S.answered=false;S.rl=0;hud();const g=S.g;if(g.gen)playChoice(g);else g.mount(makeApi(S.tok))}

function playChoice(g){const tok=S.tok;const q=fresh(()=>g.gen(S.level));

  const b=$('#board');b.innerHTML=q.board||'';if(!q.board)b.style.display='none';

  if(q.after)q.after(makeApi(tok))}

mount(a){const c=AGE_CFG.pattern[a.age],lang=a.lang(),L=a.L,n=c.n,N=n*n,cnt=Math.min(lerp(c.c1,c.c2,L),N),set=new Set(sample(range(N),cnt));let got=0,phase='show';
  a.board.innerHTML=`<div class="tgrid" style="--n:${n};--w:${Math.min(n*62,330)}px">${range(N).map(i=>`<button class="tc${set.has(i)?' lit':''}" data-i="${i}"></button>`).join('')}</div>`;
  const cells=[...a.board.querySelectorAll('.tc')];a.prompt(loc({uz:'Qora kataklarni eslab qoling 👀',ru:'Запомните чёрные клетки 👀'},lang),loc({uz:'Qora kataklarni eslab qoling',ru:'Запомните чёрные клетки'},lang));
  a.later(()=>{cells.forEach(x=>x.classList.remove('lit'));phase='in';a.prompt(loc({uz:`Qaysi kataklar qora edi? · 0/${cnt}`,ru:`Какие клетки были чёрными? · 0/${cnt}`},lang))},c.show);
  a.board.onclick=e=>{const b=e.target.closest('.tc');if(!b||phase!=='in'||!a.live())return;const i=+b.dataset.i;if(b.classList.contains('lit')||b.classList.contains('bad'))return;
    if(set.has(i)){b.classList.add('lit');got++;Snd.tap();a.prompt(loc({uz:`Qaysi kataklar qora edi? · ${got}/${cnt}`,ru:`Какие клетки были чёрными? · ${got}/${cnt}`},lang));if(got===cnt)a.done(true)}
    else{b.classList.add('bad');
      if(a.miss()){set.forEach(j=>{if(!cells[j].classList.contains('lit'))cells[j].classList.add('ok')});a.done(false,{msg:loc({uz:'Yashil kataklar — qora bo‘lganlari.',ru:'Зелёным — те, что были чёрными.'},lang)})}
      else hint(loc({uz:'Bu katak qora emas edi',ru:'Эта клетка не была чёрной'},lang))}}}});

/* 36 */ const FLY_DIRS=[{dr:-1,dc:0,a:'⬆️'},{dr:1,dc:0,a:'⬇️'},{dr:0,dc:-1,a:'⬅️'},{dr:0,dc:1,a:'➡️'},{dr:-1,dc:-1,a:'↖️'},{dr:-1,dc:1,a:'↗️'},{dr:1,dc:-1,a:'↙️'},{dr:1,dc:1,a:'↘️'}];
def({name:{uz:'Chivin yo‘li',ru:'Путь мухи'},age:'all',cat:'creative',icon:'🪰',art:'a6',sk:['F','D'],desc:{uz:'Chivin qayerga uchib borganini strelkalardan kuzatib, joyini toping.',ru:'Следите за стрелками и найдите, куда улетела муха.'},
mount(a){const c=AGE_CFG.fly[a.age],lang=a.lang(),L=a.L,n=c.n,N=n*n,cnt=lerp(c.c1,c.c2,L),cen=(n-1)>>1,ci=cen*n+cen,dirs=c.diag?FLY_DIRS:FLY_DIRS.slice(0,4);let r=cen,cc=cen,path=[];
  for(let i=0;i<cnt;i++){const ord=shuffle(dirs);for(const d of ord){const nr=r+d.dr,nc=cc+d.dc;if(nr>=0&&nr<n&&nc>=0&&nc<n){path.push(d);r=nr;cc=nc;break}}}
  a.board.innerHTML=`<div class="tgrid" style="--n:${n};--fs:26px;--w:${Math.min(n*58,300)}px">${range(N).map(i=>`<span class="tc">${i===ci?'🪰':''}</span>`).join('')}</div>`;
  const cells=[...a.board.querySelectorAll('.tc')],flyC=cells[ci];
  a.prompt(loc({uz:'Chivin qayerga uchishini diqqat bilan kuzating 👀',ru:'Внимательно следите, куда летит муха 👀'},lang),loc({uz:'Chivinni diqqat bilan kuzating',ru:'Внимательно следите за мухой'},lang));
  let i=0;const showArrow=()=>{flyC.textContent=path[i].a;i++;a.prompt(loc({uz:`Qadam ${i}/${cnt}`,ru:`Шаг ${i}/${cnt}`},lang));a.later(()=>{flyC.textContent='';if(i>=path.length)return ask();a.later(showArrow,c.gap)},c.speed)};
  a.later(showArrow,c.speed);
  const ask=()=>{a.prompt(loc({uz:'Chivin hozir qayerda? Bosing!',ru:'Где сейчас муха? Нажмите!'},lang),loc({uz:'Chivin hozir qayerda',ru:'Где сейчас муха'},lang));
    a.board.onpointerdown=e=>{const b=e.target.closest('.tc');if(!b||!a.live()||b.classList.contains('bad'))return;const idx=cells.indexOf(b);
      if(idx===r*n+cc){b.classList.add('ok');b.textContent='🪰';a.done(true)}
      else{b.classList.add('bad');a.miss();cells[r*n+cc].classList.add('ok');cells[r*n+cc].textContent='🪰';a.done(false,{msg:loc({uz:'Chivin boshqa joyda edi.',ru:'Муха была в другом месте.'},lang)})}};
    a.timer(c.ans,()=>a.done(false,{msg:tr('timeup')}))}}});

/* 37 */ def({name:{uz:'Og‘zaki hisob',ru:'Устный счёт'},age:'all',cat:'logic',icon:'🧮',art:'a3',sk:['H','T'],desc:{uz:'Misolni tez yeching — 5 ta savoldan iborat.',ru:'Быстро решайте примеры — всего 5 вопросов.'},
mount(a){const c=AGE_CFG.mental[a.age],L=a.L,age=a.age,mx=o=>o.max1!=null?lerp(o.max1,o.max,L):o.max;let q=0,tmr=null,locked=false;
  const ops=age==='4-6'?(L>=c.subFromL?['add','sub']:['add']):age==='7-9'?(L>=c.mulFromL?['add','sub','mul']:['add','sub']):['add','sub','mul','div'];
  const gen=()=>{const op=pick(ops);let x,y,ans,sym;
    if(op==='div'){y=ri(c.div.min,c.div.max);ans=ri(2,lerp(c.div.a1,c.div.a2,L));x=y*ans;sym='÷'}
    else if(op==='mul'){const m=mx(c.mul);x=ri(c.mul.min,m);y=ri(c.mul.min,m);ans=x*y;sym='×'}
    else if(op==='sub'){const m=mx(c.sub);x=ri(c.sub.min,m);y=ri(c.sub.min,x);ans=x-y;sym='−'}
    else if(age==='10-12'){const m=mx(c.add);x=ri(c.add.min,m);y=ri(c.add.min,m);ans=x+y;sym='+'}
    else{const m=mx(c.add);x=ri(c.add.min,m-c.add.min);y=ri(c.add.min,m-x);ans=x+y;sym='+'}
    return{x,y,sym,ans}};
  const step=()=>{if(tmr)tmr.stop();locked=false;if(q>=5)return a.done(true);q++;
    const lang=a.lang();
    const qq=gen(),opts=numOpts(qq.ans,[qq.ans-1,qq.ans+1,qq.ans-2,qq.ans+2,qq.ans+5,qq.ans-5],4,0),kc=opts.length<=3?opts.length:2;
    a.prompt(`<span class="mini">${loc({uz:`Savol ${q}/5`,ru:`Вопрос ${q}/5`},lang)}</span><br>${qq.x} ${qq.sym} ${qq.y} = ?`,`${qq.x} ${qq.sym} ${qq.y}`);
    a.board.innerHTML=`<div class="opts" style="width:100%;grid-template-columns:repeat(${kc},minmax(0,1fr))">${shuffle(opts).map(v=>`<button class="opt num" data-v="${v}">${v}</button>`).join('')}</div>`;
    a.board.onclick=e=>{if(locked)return;const b=e.target.closest('[data-v]');if(!b||!a.live()||b.classList.contains('bad'))return;
      if(+b.dataset.v===qq.ans){locked=true;tmr.stop();b.classList.add('ok');Snd.tap();a.later(step,450)}
      else{b.classList.add('bad');
        if(a.miss()){tmr.stop();const ok=[...a.board.querySelectorAll('[data-v]')].find(x=>+x.dataset.v===qq.ans);if(ok)ok.classList.add('ok');a.done(false,{msg:loc({uz:'To‘g‘ri javob: '+qq.ans+'.',ru:'Правильный ответ: '+qq.ans+'.'},lang)})}
        else hint(loc({uz:'Yana hisoblang',ru:'Посчитайте ещё раз'},lang))}};
    tmr=a.timer(c.time,()=>a.done(false,{msg:tr('timeup')}))};
  step()}});

/* ================= Home ================= */
const FILTER_ROWS=[[['all','filter_all'],['4-6','filter_46'],['7-9','filter_79'],['10-12','filter_1012']],[['logic','filter_logic'],['creative','filter_creative'],['super','filter_super']]];
let filter='all';try{filter=localStorage.getItem('mk_filter')||'all'}catch(e){}
function renderHome(){
  $('#chips').innerHTML=FILTER_ROWS.map(row=>`<div class="crow" style="--c:${row.length}">${row.map(([k,t])=>`<button class="chip${k===filter?' on':''}" data-f="${k}" aria-pressed="${k===filter}">${tr(t)}</button>`).join('')}</div>`).join('');
  const list=G.filter(g=>filter==='all'||inAge(g,filter)||g.cat===filter);
  $('#count').textContent=tr('count_games',{n:list.length});
  $('#grid').innerHTML=list.map(g=>{const p=ST.per[g.id];return`<button class="card" data-id="${g.id}"><span class="art ${g.art}">${g.icon}</span><span class="n">${loc(g.name)}</span><span class="d">${loc(g.desc)}</span><span class="f"><span>${tr('age_suffix',{age:ageLabel(g)})}</span><span class="stars">${starStr(p?p.st:0)}</span></span></button>`}).join('');
  const tot=G.reduce((s,g)=>s+((ST.per[g.id]||{}).st||0),0);$('#totStars').textContent=tr('total_stars',{n:tot,max:G.length*3})}
$('#chips').onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;filter=b.dataset.f;try{localStorage.setItem('mk_filter',filter)}catch(e){}renderHome();hap()};
$('#grid').onclick=e=>{const b=e.target.closest('[data-id]');if(b){hap();openGame(+b.dataset.id)}};

/* ================= Parent panel ================= */
const SK_ICON={M:'🧩',X:'🧠',D:'👀',F:'🎨',H:'🔢',T:'⚡'};
const SK_KEY={M:'sk_M',X:'sk_X',D:'sk_D',F:'sk_F',H:'sk_H',T:'sk_T'};
function renderParent(){const tot=ST.c+ST.w,acc=tot?Math.round(ST.c/tot*100):0;
  let h=`<div class="tiles4"><div class="tile4"><b>${ST.g}</b><small>${tr('p_played')}</small></div><div class="tile4"><b>${ST.s}</b><small>${tr('p_score')}</small></div><div class="tile4"><b>${tot?acc+'%':'—'}</b><small>${tr('p_acc',{n:tot})}</small></div><div class="tile4"><b>${ST.b}</b><small>${tr('p_best')}</small></div></div>`;
  if(!tot){h+=`<div class="box empty"><div>🌱</div><p>${tr('p_empty')}</p></div>`}
  else{const sk=Object.keys(SK_ICON).map(k=>{let c=0,w=0;G.filter(g=>g.sk.includes(k)).forEach(g=>{const p=ST.per[g.id];if(p){c+=p.c;w+=p.w}});return{k,c,w,n:c+w,p:c+w?Math.round(c/(c+w)*100):0}});
    h+=`<div class="box"><h3>${tr('p_skills')}</h3>${sk.map(s=>`<div class="sk"><small><span>${SK_ICON[s.k]} ${tr(SK_KEY[s.k])}</span><em>${s.n?tr('p_pct_n',{p:s.p,n:s.n}):tr('p_unplayed')}</em></small><div class="bar"><span style="width:${s.p}%"></span></div></div>`).join('')}`;
    const weak=sk.filter(s=>s.n>=5).sort((x,y)=>x.p-y.p)[0];
    if(weak&&weak.p<85){const rec=G.filter(g=>g.sk.includes(weak.k)).sort((x,y)=>((ST.per[x.id]||{}).p||0)-((ST.per[y.id]||{}).p||0)).slice(0,2);h+=`<div class="tip">${tr('p_tip',{skill:tr(SK_KEY[weak.k]),p:weak.p,games:rec.map(g=>g.icon+' '+loc(g.name)).join('</b>, <b>')})}</div>`}
    h+=`</div>`;
    const played=G.filter(g=>(ST.per[g.id]||{}).p>0).sort((x,y)=>ST.per[y.id].p-ST.per[x.id].p).slice(0,3);
    if(played.length)h+=`<div class="box"><h3>${tr('p_topplayed')}</h3>${played.map(g=>`<div class="li"><span>${g.icon} ${loc(g.name)}</span><span>${tr('p_times',{n:ST.per[g.id].p,stars:starStr(ST.per[g.id].st)})}</span></div>`).join('')}</div>`;
    const hard=G.filter(g=>{const p=ST.per[g.id];return p&&p.c+p.w>=5}).map(g=>{const p=ST.per[g.id];return{g,a:Math.round(p.c/(p.c+p.w)*100)}}).filter(x=>x.a<80).sort((x,y)=>x.a-y.a).slice(0,3);
    if(hard.length)h+=`<div class="box"><h3>${tr('p_hard')}</h3>${hard.map(x=>`<div class="li"><span>${x.g.icon} ${loc(x.g.name)}</span><span>${tr('p_hardpct',{p:x.a})}</span></div>`).join('')}</div>`}
  h+=`<button class="btn danger" id="reset">${tr('p_reset')}</button>`;
  $('#pbody').innerHTML=h;
  $('#reset').onclick=()=>{const msg=tr('p_reset_confirm');const go=()=>{ST=EMPTY();saveStats();G.forEach(g=>Store.del('mk_seen_'+g.id));renderParent();renderHome()};
    if(ver('6.2'))tg.showConfirm(msg,ok=>{if(ok)go()});else if(confirm(msg))go()}}
function openParent(){renderParent();$('#parent').classList.add('show');backBtn()}
function closeParent(){$('#parent').classList.remove('show');backBtn()}
$('#openParent').onclick=openParent;$('#openParent2').onclick=openParent;$('#pclose').onclick=closeParent;

/* ================= Wiring ================= */
function backBtn(){if(!ver('6.1'))return;try{($('#game').classList.contains('show')||$('#parent').classList.contains('show'))?tg.BackButton.show():tg.BackButton.hide()}catch(e){}}
function onBack(){if($('#game').classList.contains('show'))closeGame();else if($('#parent').classList.contains('show'))closeParent()}
$('#gclose').onclick=closeGame;$('#speak').onclick=()=>Voice.say(S.say,curLang());
function setSnd(on){Snd.on=on;try{localStorage.setItem('mk_snd',on?'1':'0')}catch(e){}$('#snd').textContent=$('#sndHome').textContent=on?'🔈':'🔇';if(!on)try{speechSynthesis.cancel()}catch(e){}}
$('#snd').onclick=$('#sndHome').onclick=()=>setSnd(!Snd.on);
let THEME='light';try{THEME=localStorage.getItem('mk_theme')||'light'}catch(e){}
function applyTheme(){const dark=THEME==='dark';document.documentElement.dataset.theme=THEME;$('#themeBtn').textContent=dark?'☀️':'🌙';$('#themeBtn').setAttribute('aria-label',dark?tr('theme_to_light'):tr('theme_to_dark'));
  const bg=dark?'#111429':'#f4f6ff';document.querySelector('meta[name=theme-color]').content=bg;
  if(ver('6.1')){try{tg.setHeaderColor(bg);tg.setBackgroundColor(bg)}catch(e){}}if(ver('7.10')){try{tg.setBottomBarColor(bg)}catch(e){}}}
$('#themeBtn').onclick=()=>{THEME=THEME==='dark'?'light':'dark';try{localStorage.setItem('mk_theme',THEME)}catch(e){}applyTheme();hap()};
$('#langBtn').onclick=()=>{setLang(LANG==='uz'?'ru':'uz');hap()};
function syncGlang(){const btn=$('#glang');if(!btn)return;const show=!!(S.g&&S.g.id===32);btn.style.display=show?'':'none';if(show)btn.textContent=(S.stroopLang||LANG).toUpperCase()}
$('#glang').onclick=()=>{const cyc=['uz','ru','en'],cur=S.stroopLang||LANG;S.stroopLang=cyc[(cyc.indexOf(cur)+1)%cyc.length];Store.set('mk_lang_stroop',S.stroopLang);syncGlang();hap()};

(async function init(){
  $('#heroBrain').src=document.querySelector('.logo').src;
  LANG=await Store.get('mk_lang')||'uz';$('#langBtn').textContent=LANG.toUpperCase();applyI18n();
  applyTheme();
  if(inTg){try{tg.ready();tg.expand();if(ver('7.7'))tg.disableVerticalSwipes();if(ver('6.1'))tg.BackButton.onClick(onBack)}catch(e){}applyTheme()}
  let so='1';try{so=localStorage.getItem('mk_snd')||'1'}catch(e){}setSnd(so!=='0');
  updateGreeting();
  Voice.init();renderHome();await loadStats();renderHome();
})();
</script>
